name: Node.js CI/CD with OIDC

on:
  push:
    branches: prototype

env:
  AWS_REGION: eu-west-2
  ECR_REPO: ilm-brain-main-prototype
  EB_APP_NAME: Ilm-brain-main-prototype
  EB_ENV_NAME: Ilm-brain-main-prototype-env
  S3_BUCKET: elasticbeanstalk-eu-west-2-013419929011

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test || true

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::013419929011:role/GitHubActions-ElasticBeanstalk-OIDC
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Docker image
      run: |
        TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
        IMAGE_TAG=$TIMESTAMP
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        docker build -t $ECR_REPO:$IMAGE_TAG .
        docker tag $ECR_REPO:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
        docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
    - name: Generate Dockerrun.aws.json
      run: |
        IMAGE="${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG"
        ARTIFACT_KEY="deployments/Dockerrun-${IMAGE_TAG}.json"
        echo "ARTIFACT_KEY=$ARTIFACT_KEY" >> $GITHUB_ENV
        echo '{
          "AWSEBDockerrunVersion": "1",
          "Image": {
            "Name": "'"$IMAGE"'"
          },
          "Ports": [
            {
              "ContainerPort": 3000,
              "HostPort": 3000
            }
          ],
          "Logging": "/var/log/nginx"
        }' > Dockerrun.aws.json
    - name: Upload Dockerrun.aws.json to S3
      run: |
        aws s3 cp Dockerrun.aws.json s3://$S3_BUCKET/$ARTIFACT_KEY
    - name: Deploy to Elastic Beanstalk
      run: |
        aws elasticbeanstalk create-application-version \
          --application-name $EB_APP_NAME \
          --version-label "ver-${IMAGE_TAG}" \
          --source-bundle S3Bucket=$S3_BUCKET,S3Key=$ARTIFACT_KEY
        aws elasticbeanstalk update-environment \
          --environment-name $EB_ENV_NAME \
          --version-label "ver-${IMAGE_TAG}"
